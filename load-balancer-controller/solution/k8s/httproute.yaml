apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-echo
spec:
  parentRefs:
    - name: public
      namespace: platform
  rules:
    - matches:
        - path:
            value: /echo
            type: PathPrefix
      backendRefs:
        - name: echo
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-nginx
spec:
  parentRefs:
    - name: public
      namespace: platform
  rules:
    - matches:
        - path:
            value: /
            type: PathPrefix
      backendRefs:
        - name: nginx
          port: 80