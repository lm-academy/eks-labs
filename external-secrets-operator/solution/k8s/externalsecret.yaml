apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: orders
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: orders/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: orders/db-credentials
        property: password