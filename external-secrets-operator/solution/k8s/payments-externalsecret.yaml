apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: via-orders-store
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: orders
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: orders/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: orders/db-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: via-payments-store
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: payments
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: orders/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: orders/db-credentials
        property: password