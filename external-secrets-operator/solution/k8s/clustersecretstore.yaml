apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: orders
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      role: arn:aws:iam::267049704011:role/eso-lab-orders-secrets
  conditions:
    - namespaces: [orders]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: payments
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      role: arn:aws:iam::267049704011:role/eso-lab-payments-secrets
  conditions:
    - namespaces: [payments]